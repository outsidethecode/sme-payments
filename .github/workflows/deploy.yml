# ─── Deploy Pipeline (GCP Cloud Run) ──────────────────────────
# Builds Docker images, pushes to Artifact Registry, deploys to Cloud Run
# Uses Workload Identity Federation (no service account keys)
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: me-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  PROJECT_PREFIX: taysiro
  ENVIRONMENT: pilot

permissions:
  id-token: write # Required for Workload Identity Federation
  contents: read

jobs:
  # ── Detect what changed ──────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/**'
            frontend:
              - 'frontend/**'
              - 'packages/**'

  # ── Deploy Backend ────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.PROJECT_PREFIX }}-backend
        run: |
          docker build \
            -t $REPO/backend:$IMAGE_TAG \
            -t $REPO/backend:latest \
            ./backend
          docker push $REPO/backend:$IMAGE_TAG
          docker push $REPO/backend:latest

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.PROJECT_PREFIX }}-backend
          SERVICE: ${{ env.PROJECT_PREFIX }}-backend-${{ env.ENVIRONMENT }}
        run: |
          gcloud run services update $SERVICE \
            --image $REPO/backend:$IMAGE_TAG \
            --region ${{ env.GCP_REGION }} \
            --quiet

          echo "Waiting for deployment to stabilize..."
          gcloud run services describe $SERVICE \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)"

          echo "✅ Backend deployed successfully"

  # ── Deploy Frontend ───────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [changes, deploy-backend]
    if: always() && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Get Backend URL
        id: backend
        env:
          SERVICE: ${{ env.PROJECT_PREFIX }}-backend-${{ env.ENVIRONMENT }}
        run: |
          BACKEND_URL=$(gcloud run services describe $SERVICE \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "https://placeholder.run.app")
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.PROJECT_PREFIX }}-frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.backend.outputs.url }} \
            -t $REPO/frontend:$IMAGE_TAG \
            -t $REPO/frontend:latest \
            ./frontend
          docker push $REPO/frontend:$IMAGE_TAG
          docker push $REPO/frontend:latest

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.PROJECT_PREFIX }}-frontend
          SERVICE: ${{ env.PROJECT_PREFIX }}-frontend-${{ env.ENVIRONMENT }}
        run: |
          gcloud run services update $SERVICE \
            --image $REPO/frontend:$IMAGE_TAG \
            --region ${{ env.GCP_REGION }} \
            --quiet

          FRONTEND_URL=$(gcloud run services describe $SERVICE \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)")

          echo "✅ Frontend deployed: $FRONTEND_URL"
